name: Build All In One Tool APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Java (LTS 17)
      uses: actions/setup-java@v3
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter SDK
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.19.0'
        channel: 'stable'

    - name: Create Flutter Project and Setup App
      run: |
        flutter create --org com.ayush.allinone all_in_one_tool
        cd all_in_one_tool
        
        cat << 'EOF' > pubspec.yaml
name: all_in_one_tool
description: Clean & Premium Material 3 PDF & Image Suite.
publish_to: 'none'
version: 3.0.0+1
environment:
  sdk: '>=3.0.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  image_picker: ^1.0.7
  pdf: ^3.10.8
  image: ^4.1.3
  path_provider: ^2.1.2
  file_picker: ^6.1.1
  share_plus: ^7.2.1
  google_fonts: ^6.1.0
flutter:
  uses-material-design: true
EOF

        flutter pub get

    - name: Build Release APK
      run: |
        cd all_in_one_tool
        flutter build apk --release --split-per-abi

    - name: Upload Final APK to GitHub Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: AllInOneTool-CleanApp
        path: all_in_one_tool/build/app/outputs/flutter-apk/app-release.apk
